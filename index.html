<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ゲーム進捗管理</title>
<style>
  :root {
    --bg: #14161c;
    --panel: #1c1f29;
    --panel2: #232735;
    --line: #313646;
    --text: #e6e8ee;
    --muted: #9aa1b2;
    --accent: #5b8cff;
    --accent-d: #4070e0;
    --danger: #e0556b;
    --ok: #3fb27f;
    --warn: #e0a23f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, sans-serif;
    font-size: 14px;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    flex: 0 0 auto;
  }
  .topbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  h1 {
    font-size: 16px;
    margin: 0 12px 0 0;
    white-space: nowrap;
  }
  h1 .count { color: var(--muted); font-size: 12px; font-weight: normal; margin-left: 6px; }
  input, select, button, textarea {
    font-family: inherit;
    font-size: 14px;
    color: var(--text);
    background: var(--panel2);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 7px 10px;
    outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  input::placeholder { color: var(--muted); }
  button { cursor: pointer; transition: background .12s, border-color .12s; }
  button:hover { border-color: var(--accent); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn-primary:hover { background: var(--accent-d); }
  .btn-danger { background: transparent; border-color: var(--danger); color: var(--danger); }
  .btn-danger:hover { background: var(--danger); color: #fff; }
  .btn-ghost { background: transparent; }
  .grow { flex: 1 1 220px; min-width: 160px; }
  .spacer { flex: 1 1 auto; }

  main { flex: 1 1 auto; overflow: auto; }
  table { border-collapse: collapse; width: 100%; }
  th, td {
    border-bottom: 1px solid var(--line);
    padding: 9px 12px;
    text-align: left;
    vertical-align: top;
    white-space: nowrap;
    max-width: 320px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  td.wrap { white-space: normal; min-width: 160px; }
  thead th {
    position: sticky;
    top: 0;
    background: var(--panel2);
    z-index: 2;
    cursor: pointer;
    user-select: none;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: .03em;
  }
  thead th:hover { color: var(--text); }
  thead th .arrow { color: var(--accent); margin-left: 4px; }
  tbody tr:hover { background: var(--panel); }
  tbody tr { cursor: pointer; }
  td .pill {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }
  .title-cell { font-weight: 600; }
  .muted { color: var(--muted); }
  .actions-cell { white-space: nowrap; }
  .actions-cell button { padding: 4px 8px; font-size: 12px; margin-left: 4px; }
  .empty { text-align: center; color: var(--muted); padding: 48px 16px; }
  a { color: var(--accent); }

  /* modal */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.55);
    display: none;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px;
    overflow: auto;
    z-index: 50;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    width: 100%;
    max-width: 560px;
    padding: 20px 22px;
  }
  .modal h2 { margin: 0 0 16px; font-size: 17px; }
  .field { margin-bottom: 13px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .field input, .field select, .field textarea { width: 100%; }
  .field textarea { resize: vertical; min-height: 56px; }
  .field .hint { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
  .modal-actions .spacer { flex: 1; }

  .col-row {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 0; border-bottom: 1px solid var(--line);
  }
  .col-row .name { flex: 1; }
  .col-row.fixed .name { color: var(--muted); }
  .col-row.hidden .name { color: var(--muted); text-decoration: line-through; }
  .col-row input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
  .col-row button { font-size: 12px; padding: 3px 9px; }
  .col-row .ord { background: transparent; border: 1px solid var(--line); padding: 3px 8px; line-height: 1; }
  .col-row .ord:disabled { opacity: .3; cursor: default; }
  .add-col { display: flex; gap: 8px; margin-top: 12px; }
  .add-col input { flex: 1; }

  .opts-list { max-height: 50vh; overflow: auto; margin-top: 6px; border: 1px solid var(--line); border-radius: 8px; }
  .opt-row { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--line); }
  .opt-row:last-child { border-bottom: none; }
  .opt-row .name { flex: 1; }
  .opt-row.hidden .name { color: var(--muted); text-decoration: line-through; }
  .opt-row input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
  .opt-row .ord { background: transparent; border: 1px solid var(--line); padding: 2px 8px; line-height: 1; }
  .opt-row .ord:disabled { opacity: .3; cursor: default; }
  .opt-row .del { background: transparent; border-color: transparent; color: var(--danger); padding: 2px 8px; }
  .opt-row .del:hover { border-color: var(--danger); }

  /* 詳細表示 */
  .detail-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
  .detail-head h2 { margin: 0; flex: 1; font-size: 18px; word-break: break-word; }
  .detail-actions { display: flex; gap: 8px; flex: 0 0 auto; }
  .detail-actions button { padding: 6px 12px; font-size: 13px; }
  .detail-row { display: flex; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .detail-label { flex: 0 0 96px; color: var(--muted); font-size: 12px; padding-top: 2px; }
  .detail-value { flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-word; }
  .detail-value.empty { color: var(--muted); }
  /* 参考サイト：詳細では最大5行、超過分はスクロール */
  .ref-list { max-height: 8.6em; overflow: auto; }
  .ref-item { line-height: 1.7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ==== マインドマップ ==== */
  #mindmapScreen {
    position: fixed; inset: 0; z-index: 60;
    background: var(--bg);
    display: none;
    flex-direction: column;
  }
  #mindmapScreen.open { display: flex; }
  .mm-toolbar {
    flex: 0 0 auto;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  .mm-toolbar h2 {
    font-size: 15px; margin: 0; white-space: nowrap;
    max-width: 32vw; overflow: hidden; text-overflow: ellipsis;
  }
  .mm-toolbar button { padding: 6px 10px; font-size: 13px; }
  .mm-toolbar .grp {
    display: flex; align-items: center; gap: 4px;
    border-left: 1px solid var(--line); padding-left: 8px;
  }
  .mm-toolbar .grp .lbl { color: var(--muted); font-size: 12px; }
  .mm-toolbar .zval { color: var(--muted); font-size: 12px; min-width: 44px; text-align: center; }
  .mm-hint { color: var(--muted); font-size: 12px; flex: 1 1 100%; }

  .mm-canvas {
    position: relative; flex: 1 1 auto; overflow: hidden;
    cursor: default;
    background: radial-gradient(circle, #2a2f3d 1px, transparent 1px);
    background-size: 26px 26px;
  }
  .mm-canvas.panning { cursor: grabbing; }
  /* 範囲選択の矩形 */
  .mm-selectbox {
    position: absolute; z-index: 6; display: none;
    border: 1px dashed var(--accent);
    background: rgba(91,140,255,.12);
    pointer-events: none;
  }
  .mm-world { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  #mmEdges {
    position: absolute; top: 0; left: 0; width: 1px; height: 1px;
    overflow: visible; pointer-events: none;
  }

  .mm-node {
    position: absolute;
    background: var(--panel2);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 12px;
    min-width: 56px; max-width: 260px;
    cursor: move;
    box-shadow: 0 2px 8px rgba(0,0,0,.3);
  }
  .mm-node.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(91,140,255,.4); }
  .mm-node.connect-src { border-color: var(--ok); box-shadow: 0 0 0 2px rgba(63,178,127,.4); }
  .mm-node.heading { border-left: 4px solid var(--warn); }
  .mm-node-content { white-space: pre-wrap; word-break: break-word; line-height: 1.5; height: 100%; overflow: auto; }
  .mm-node-content a { color: var(--accent); }
  .mm-node-content img { max-width: 100%; height: auto; border-radius: 4px; display: block; margin: 2px 0; }
  .mm-node-content .placeholder { color: var(--muted); }
  .mm-node-badge {
    position: absolute; top: -9px; left: -6px;
    font-size: 11px; line-height: 1;
    background: var(--warn); color: #1b1300;
    padding: 2px 6px; border-radius: 999px; font-weight: 600;
  }
  .mm-node-edit {
    width: 100%; height: 100%; min-height: 3em; resize: none;
    font-size: inherit; line-height: 1.5; padding: 2px 4px; overflow: auto;
  }
  .mm-node-del {
    position: absolute; top: -10px; right: -10px;
    width: 20px; height: 20px; line-height: 1; padding: 0;
    border-radius: 50%; font-size: 12px;
    background: var(--danger); border-color: var(--danger); color: #fff;
    display: none; cursor: pointer; z-index: 2;
  }
  .mm-node:hover .mm-node-del, .mm-node.selected .mm-node-del { display: block; }
  /* サイズ変更ハンドル（右下） */
  .mm-node-resize {
    position: absolute; right: 1px; bottom: 1px;
    width: 14px; height: 14px; cursor: nwse-resize; display: none; z-index: 2;
  }
  .mm-node-resize::after {
    content: ""; position: absolute; right: 1px; bottom: 1px;
    width: 0; height: 0;
    border-left: 9px solid transparent; border-bottom: 9px solid var(--muted);
  }
  .mm-node:hover .mm-node-resize, .mm-node.selected .mm-node-resize { display: block; }

  /* 見出し一覧パネル（右側） */
  .mm-headings {
    position: absolute; top: 10px; right: 10px; z-index: 7;
    width: 210px; max-height: calc(100% - 20px);
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; overflow: hidden;
  }
  .mm-headings.collapsed { width: auto; }
  .mm-headings.collapsed .mm-headings-list,
  .mm-headings.collapsed .mm-head-title { display: none; }
  .mm-headings-bar {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 8px; border-bottom: 1px solid var(--line);
  }
  .mm-headings.collapsed .mm-headings-bar { border-bottom: none; }
  .mm-head-title { font-size: 12px; color: var(--muted); }
  .mm-head-toggle { padding: 2px 8px; font-size: 12px; }
  .mm-headings-list { overflow: auto; padding: 4px; }
  .mm-heading-item {
    padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 13px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .mm-heading-item:hover { background: var(--panel2); }
  .mm-headings-empty { padding: 8px; color: var(--muted); font-size: 12px; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--panel2); border: 1px solid var(--accent);
    padding: 10px 18px; border-radius: 8px; z-index: 100;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <div class="topbar">
    <h1>🎮 ゲーム進捗管理<span class="count" id="count"></span></h1>
    <input class="grow" id="search" type="search" placeholder="検索（タイトル・シリーズ・ジャンル・メモ…）">
    <select id="filterStatus" title="ステータスで絞り込み">
      <option value="">全ステータス</option>
    </select>
    <span class="spacer"></span>
    <button class="btn-primary" id="addBtn">＋ 新規追加</button>
    <button class="btn-ghost" id="optsBtn">選択肢の設定</button>
    <button class="btn-ghost" id="colsBtn">列の管理</button>
    <button class="btn-ghost" id="exportBtn">エクスポート</button>
    <button class="btn-ghost" id="importBtn">インポート</button>
    <input type="file" id="importFile" accept="application/json" style="display:none">
  </div>
</header>

<main>
  <table id="table">
    <thead><tr id="headRow"></tr></thead>
    <tbody id="body"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none"></div>
</main>

<!-- 追加・編集モーダル -->
<div class="overlay" id="editOverlay">
  <div class="modal">
    <h2 id="editTitle">ゲームを追加</h2>
    <div id="editFields"></div>
    <div class="modal-actions">
      <button class="btn-danger" id="deleteBtn" style="display:none">削除</button>
      <span class="spacer"></span>
      <button class="btn-ghost" id="cancelEdit">キャンセル</button>
      <button class="btn-primary" id="saveEdit">保存</button>
    </div>
  </div>
</div>

<!-- 詳細表示モーダル -->
<div class="overlay" id="detailOverlay">
  <div class="modal">
    <div class="detail-head">
      <h2 id="detailTitle"></h2>
      <div class="detail-actions">
        <button class="btn-danger" id="detailDelete">削除</button>
        <button class="btn-primary" id="detailEdit">編集</button>
        <button class="btn-ghost" id="detailClose" title="閉じる">✕</button>
      </div>
    </div>
    <div id="detailBody"></div>
  </div>
</div>

<!-- 選択肢の設定モーダル -->
<div class="overlay" id="optsOverlay">
  <div class="modal">
    <h2>選択肢の設定</h2>
    <p class="muted" style="margin-top:0;font-size:12px">プルダウンに表示する選択肢の <b>表示／非表示</b>・<b>並び順</b> を変更したり、<b>自分で追加</b> できます。一覧にない値は入力欄に直接書いてもOKです。</p>
    <div class="field">
      <label>編集する項目</label>
      <select id="optTarget"></select>
    </div>
    <div id="optsList" class="opts-list"></div>
    <div class="add-col">
      <input id="newOptName" type="text" placeholder="選択肢を追加（例：Xbox、Steam Deck…）">
      <button class="btn-primary" id="addOptBtn">追加</button>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" id="resetOptBtn">選択肢を初期値に戻す</button>
      <span class="spacer"></span>
      <button class="btn-primary" id="closeOpts">閉じる</button>
    </div>
  </div>
</div>

<!-- 列管理モーダル -->
<div class="overlay" id="colsOverlay">
  <div class="modal">
    <h2>列（項目）の管理</h2>
    <p class="muted" style="margin-top:0;font-size:12px">「タイトル」より下の項目は ▲▼ で並び順を変更できます。左のチェックで一覧の <b>表示／非表示</b> を切り替え（データは残ります）。任意項目は名前変更・削除も可能です。</p>
    <div id="colsList"></div>
    <div class="add-col">
      <input id="newColName" type="text" placeholder="新しい項目名（例：難易度、おすすめ度…）">
      <select id="newColType" title="入力タイプ">
        <option value="text">文字</option>
        <option value="number">数値</option>
        <option value="date">日付</option>
      </select>
      <button class="btn-primary" id="addColBtn">追加</button>
    </div>
    <div class="modal-actions">
      <button class="btn-primary" id="closeCols">閉じる</button>
    </div>
  </div>
</div>

<!-- マインドマップ画面 -->
<div id="mindmapScreen">
  <div class="mm-toolbar">
    <button class="btn-ghost" id="mmBack">← 戻る</button>
    <h2 id="mmTitle"></h2>
    <span class="spacer"></span>
    <button class="btn-primary" id="mmAddNode">＋ 四角を追加</button>
    <button class="btn-ghost" id="mmConnect">接続</button>
    <button class="btn-ghost" id="mmHeading">見出し</button>
    <button class="btn-ghost" id="mmUndo" title="元に戻す（Ctrl+Z）">↩ 戻す</button>
    <div class="grp">
      <span class="lbl">文字</span>
      <button class="btn-ghost" id="mmFontDown" title="文字を小さく">－</button>
      <span class="zval" id="mmFontVal"></span>
      <button class="btn-ghost" id="mmFontUp" title="文字を大きく">＋</button>
    </div>
    <div class="grp">
      <span class="lbl">表示</span>
      <button class="btn-ghost" id="mmZoomOut" title="縮小">－</button>
      <span class="zval" id="mmZoomVal"></span>
      <button class="btn-ghost" id="mmZoomIn" title="拡大">＋</button>
      <button class="btn-ghost" id="mmZoomReset" title="等倍に戻す">リセット</button>
    </div>
    <span class="mm-hint" id="mmHint"></span>
  </div>
  <div class="mm-canvas" id="mmCanvas">
    <div class="mm-world" id="mmWorld">
      <svg id="mmEdges"></svg>
      <div id="mmNodes"></div>
    </div>
    <div class="mm-selectbox" id="mmSelectBox"></div>
    <div class="mm-headings" id="mmHeadings">
      <div class="mm-headings-bar">
        <button class="mm-head-toggle" id="mmHeadToggle" title="見出し一覧の表示切替">◀</button>
        <span class="mm-head-title">見出し一覧</span>
      </div>
      <div class="mm-headings-list" id="mmHeadingsList"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

const STORAGE_KEY = "game-progress-tracker-v1";

// 標準項目（固定）。key はデータ保存用、label は表示名。
// 既定の並び順は DEFAULT_ORDER で定義する（title は常に先頭、updatedAt は常に末尾）。
const FIXED_COLUMNS = [
  { key: "title",        label: "タイトル",            type: "text" },
  { key: "series",       label: "シリーズ",            type: "text" },
  { key: "platform",     label: "プラットフォーム",    type: "datalist" },
  { key: "genre",        label: "ジャンル",            type: "datalist" },
  { key: "status",       label: "ステータス",          type: "status" },
  { key: "nextTodo",     label: "メモ",                type: "textarea" },
  { key: "refs",         label: "参考サイト",          type: "refs" },
  { key: "playtime",     label: "プレイ時間",          type: "number" },
  { key: "clearDate",    label: "クリア日",            type: "date" },
  { key: "purchaseDate", label: "購入日",              type: "date" },
  { key: "updatedAt",    label: "更新日時",            type: "auto" },
];

// タイトル以降の既定の並び順（key／任意列は "x:名前"）。updatedAt は常に末尾。
const DEFAULT_ORDER = [
  "series", "platform", "genre", "status", "nextTodo", "refs",
  "x:ルート", "x:主人公", "playtime", "clearDate", "purchaseDate",
];

const STATUS_OPTIONS = ["未プレイ", "積みゲー", "プレイ中", "中断", "クリア", "やり込み中", "コンプリート"];
const STATUS_COLORS = {
  "未プレイ":     "#3a4055",
  "積みゲー":     "#6b5a2e",
  "プレイ中":     "#2f6fb0",
  "中断":         "#7a4a4a",
  "クリア":       "#2f7a55",
  "やり込み中":   "#4a5fa0",
  "コンプリート": "#6a3f8a",
};

// プルダウン選択肢の初期値（表示有無・並び順・追加は「選択肢の設定」で変更可能）
// 日本国内の発売年月日順（PC は最後）
const DEFAULT_PLATFORMS = ["FC","MD","GB","SFC","SS","PS","N64","DC","WS","PS2","GBA","GC","Xbox","DS","PSP","Xbox 360","PS3","Wii","3DS","PSvita","WiiU","PS4","Xbox One","Switch","Xbox Series X/S","PS5","Switch2","PC"];
// ゲームジャンル
const DEFAULT_GENRES = ["アクション","アドベンチャー","RPG","MMO","シミュレーション","ストラテジー","ハクスラ","サバイバル","ローグライク","ローグライト","ホラー","FPS","TPS","サンドボックス"];

// 選択肢リストを編集できる項目の定義（key は FIXED_COLUMNS の key と対応）
const OPTION_FIELDS = {
  platform: { label: "プラットフォーム", defaults: DEFAULT_PLATFORMS },
  genre:    { label: "ジャンル",         defaults: DEFAULT_GENRES },
};

// 「選択肢の設定」画面でのみ使う表示名（保存値・他画面の表示は短縮名のまま）
const OPT_DISPLAY_LABELS = {
  platform: {
    "MD": "MD(メガドライブ)",
    "SS": "SS(セガサターン)",
    "DC": "DC(ドリームキャスト)",
    "WS": "WS(ワンダースワン)",
  },
};

// 表示する選択肢（並び順どおり）を取得
function getOptions(field) {
  return (data.options?.[field] || []).filter(o => o.show !== false).map(o => o.v);
}

// ---- データ読み込み ----
// 新規データの初期値（任意追加項目の name と入力タイプ）
function freshData() {
  return {
    v: 5,
    customColumns: [
      { name: "ルート", type: "text" },
      { name: "主人公", type: "text" },
    ],
    hiddenColumns: [],
    labels: {},
    games: [],
  };
}

// 旧データを最新形式へ移行・正規化する（loadData / importData 共通）
function migrate(d) {
  // v2 への移行（旧データ）
  if (!d.v || d.v < 2) {
    // 任意項目：文字列 → {name, type} へ変換
    d.customColumns = (d.customColumns || []).map(c =>
      typeof c === "string" ? { name: c, type: "text" } : c);
    const names = new Set(d.customColumns.map(c => c.name));
    if (!names.has("プレイ時間")) d.customColumns.push({ name: "プレイ時間", type: "number" });
    if (!names.has("クリア日"))   d.customColumns.push({ name: "クリア日",   type: "date" });
    // ジャンルの選択肢を新しい初期値に更新
    d.options = d.options || {};
    d.options.genre = DEFAULT_GENRES.map(v => ({ v, show: true }));
    d.v = 2;
  }
  // 選択肢リストの初期化
  if (!d.options) d.options = {};
  for (const [key, def] of Object.entries(OPTION_FIELDS)) {
    if (!Array.isArray(d.options[key])) {
      d.options[key] = def.defaults.map(v => ({ v, show: true }));
    }
  }
  // v3：プラットフォーム選択肢を新しい初期値（日本の発売年順＋機種追加）に更新。
  // 表示ON/OFF とユーザー独自追加の選択肢は保持する。
  if (!d.v || d.v < 3) {
    const existing = Array.isArray(d.options.platform) ? d.options.platform : [];
    const showOf = new Map(existing.map(o => [o.v === "64" ? "N64" : o.v, o.show !== false]));
    const merged = DEFAULT_PLATFORMS.map(v => ({ v, show: showOf.has(v) ? showOf.get(v) : true }));
    for (const o of existing) {
      const v = o.v === "64" ? "N64" : o.v;
      if (!DEFAULT_PLATFORMS.includes(v)) merged.push({ v, show: o.show !== false });
    }
    d.options.platform = merged;
    d.v = 3;
  }
  // v4：プレイ時間・クリア日を任意項目から標準項目へ昇格。
  // 各ゲームの extra に入っていた値を標準フィールド（playtime / clearDate）へ移し、
  // 任意項目の定義と並び順キーを置き換える。
  if (!d.v || d.v < 4) {
    const moves = [
      { name: "プレイ時間", key: "playtime" },
      { name: "クリア日",   key: "clearDate" },
    ];
    for (const g of d.games || []) {
      if (!g.extra) continue;
      for (const m of moves) {
        if (m.name in g.extra) {
          if (g[m.key] === undefined || g[m.key] === "") g[m.key] = g.extra[m.name];
          delete g.extra[m.name];
        }
      }
    }
    const moveNames = new Set(moves.map(m => m.name));
    d.customColumns = (d.customColumns || []).filter(c => !moveNames.has(c.name));
    if (Array.isArray(d.order)) {
      const keyOf = { "x:プレイ時間": "playtime", "x:クリア日": "clearDate" };
      d.order = d.order.map(k => keyOf[k] || k);
    }
    d.v = 4;
  }
  // v5：参考サイト列を追加し、メモ（旧「次にやること」）の直後に配置。
  // 標準列の表示名カスタム（labels）も導入。
  if (!d.v || d.v < 5) {
    if (!d.labels) d.labels = {};
    if (Array.isArray(d.order) && !d.order.includes("refs")) {
      const at = d.order.indexOf("nextTodo");
      if (at >= 0) d.order.splice(at + 1, 0, "refs");
      else d.order.push("refs");
    }
    d.v = 5;
  }
  // 非表示列リスト・表示名カスタムの初期化
  if (!Array.isArray(d.hiddenColumns)) d.hiddenColumns = [];
  if (!d.labels || typeof d.labels !== "object") d.labels = {};
  return d;
}

function loadData() {
  let d = null;
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) d = JSON.parse(raw);
  } catch (e) { console.error(e); }
  return migrate(d || freshData());
}

// タイトル以降の列の並び順（キー配列）を整える。
// 固定列キー（platform等）と任意列キー（"x:名前"）と "updatedAt" を含む。
function defaultOrderKeys() {
  const valid = new Set([
    ...FIXED_COLUMNS.filter(c => c.key !== "title" && c.key !== "updatedAt").map(c => c.key),
    ...data.customColumns.map(c => "x:" + c.name),
  ]);
  // DEFAULT_ORDER の順を優先し、未掲載の項目は後ろへ。updatedAt は常に末尾。
  const ordered = DEFAULT_ORDER.filter(k => valid.has(k));
  const rest = [...valid].filter(k => !ordered.includes(k));
  return [...ordered, ...rest, "updatedAt"];
}
function normalizeOrder() {
  const valid = new Set(defaultOrderKeys());
  if (!Array.isArray(data.order)) data.order = [];
  data.order = data.order.filter(k => valid.has(k)); // 不要キーを除去
  for (const k of defaultOrderKeys()) {              // 不足キーを補完
    if (data.order.includes(k)) continue;
    const at = data.order.indexOf("updatedAt");
    if (k !== "updatedAt" && at >= 0) data.order.splice(at, 0, k);
    else data.order.push(k);
  }
}

let data = loadData();
normalizeOrder();

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

// ---- 表示状態 ----
let sortKey = "updatedAt";
let sortDir = -1; // -1: 降順, 1: 昇順
let searchText = "";
let filterStatus = "";

// 全列の定義を返す。先頭は常に「タイトル」、以降は data.order の並び順。
// 標準列の表示名（ユーザーが「列の管理」で変更した名前があればそれを使う）
function colLabel(key, fallback) {
  return (data.labels && data.labels[key]) || fallback;
}

function allColumns() {
  const titleFc = FIXED_COLUMNS.find(c => c.key === "title");
  const cols = [{ ...titleFc, label: colLabel("title", titleFc.label) }];
  for (const key of data.order) {
    if (key.startsWith("x:")) {
      const name = key.slice(2);
      const cc = data.customColumns.find(c => c.name === name);
      if (cc) cols.push({ key, label: name, type: cc.type || "text", custom: true });
    } else {
      const fc = FIXED_COLUMNS.find(c => c.key === key);
      if (fc) cols.push({ ...fc, label: colLabel(fc.key, fc.label) });
    }
  }
  return cols;
}

// 一覧（テーブル）に表示する列。非表示に設定された列を除く（タイトルは常に表示）。
function visibleColumns() {
  return allColumns().filter(c => c.key === "title" || !isHidden(c.key));
}
function isHidden(key) {
  return data.hiddenColumns.includes(key);
}

function getValue(game, col) {
  if (col.custom) return (game.extra && game.extra[col.label]) || "";
  return game[col.key] || "";
}

// ---- フォーマット ----
function fmtDateTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

// ---- 参考サイト ----
// 1行 = 1サイト。先頭トークンを URL、残りをページ名（任意）とみなす。
function parseRef(line) {
  const s = (line || "").trim();
  if (!s) return null;
  const sp = s.search(/\s/);
  const url = sp === -1 ? s : s.slice(0, sp);
  const page = sp === -1 ? "" : s.slice(sp + 1).trim();
  return { url, page };
}
// URL からサイト名（ドメインの www. を除いたもの）を作る
function siteName(url) {
  try { return new URL(url).hostname.replace(/^www\./, ""); }
  catch (e) { return url; }
}
// リンクの表示テキスト：ページ名あり→「サイト名_ページ名」、なし→URLそのまま。長い場合は末尾省略。
function refLabel(ref) {
  const text = ref.page ? siteName(ref.url) + "_" + ref.page : ref.url;
  return text.length > 30 ? text.slice(0, 30) + "…" : text;
}
function makeRefLink(ref) {
  const a = document.createElement("a");
  a.href = ref.url;
  a.target = "_blank";
  a.rel = "noopener";
  a.textContent = refLabel(ref);
  a.title = ref.url;
  a.onclick = e => e.stopPropagation(); // 行クリック（詳細表示）と分離
  return a;
}
function refLines(raw) {
  return String(raw || "").split(/\r?\n/).map(l => l.trim()).filter(Boolean);
}

// ---- 一覧描画 ----
// 絞り込み・並べ替え済みの行を返す
function getRows(cols) {
  let rows = data.games.slice();
  const q = searchText.trim().toLowerCase();
  if (q) {
    rows = rows.filter(g => {
      const hay = [g.title, g.platform, g.series, g.genre, g.status, g.nextTodo, g.refs,
        ...Object.values(g.extra || {})].join(" ").toLowerCase();
      return hay.includes(q);
    });
  }
  if (filterStatus) rows = rows.filter(g => g.status === filterStatus);

  rows.sort((a, b) => {
    const col = cols.find(c => c.key === sortKey) || cols[0];
    let va = getValue(a, col), vb = getValue(b, col);
    if (col.type === "date" || col.type === "number" || col.key === "updatedAt") {
      if (col.type === "number") { va = parseFloat(va) || 0; vb = parseFloat(vb) || 0; }
      else { va = va ? new Date(va).getTime() : 0; vb = vb ? new Date(vb).getTime() : 0; }
    } else {
      va = String(va).toLowerCase(); vb = String(vb).toLowerCase();
    }
    if (va < vb) return -1 * sortDir;
    if (va > vb) return 1 * sortDir;
    return 0;
  });
  return rows;
}

function render() {
  const cols = visibleColumns();
  const rows = getRows(cols);
  const tableEl = document.getElementById("table");
  renderTable(cols, rows);

  document.getElementById("count").textContent = `（${rows.length} / ${data.games.length} 本）`;
  const empty = document.getElementById("empty");
  if (data.games.length === 0) {
    empty.style.display = "block";
    empty.textContent = "まだ登録がありません。「＋ 新規追加」から始めましょう。";
    tableEl.style.display = "none";
  } else if (rows.length === 0) {
    empty.style.display = "block";
    empty.textContent = "条件に一致するゲームがありません。";
    tableEl.style.display = "";
  } else {
    empty.style.display = "none";
    tableEl.style.display = "";
  }
  refreshStatusFilter();
}

function renderTable(cols, rows) {
  // ヘッダー
  const head = document.getElementById("headRow");
  head.innerHTML = "";
  for (const col of cols) {
    const th = document.createElement("th");
    th.textContent = col.label;
    if (sortKey === col.key) {
      const a = document.createElement("span");
      a.className = "arrow";
      a.textContent = sortDir === 1 ? "▲" : "▼";
      th.appendChild(a);
    }
    th.onclick = () => {
      if (sortKey === col.key) sortDir *= -1;
      else { sortKey = col.key; sortDir = 1; }
      render();
    };
    head.appendChild(th);
  }
  const thAct = document.createElement("th");
  thAct.textContent = "操作";
  head.appendChild(thAct);

  const body = document.getElementById("body");
  body.innerHTML = "";
  for (const g of rows) {
    const tr = document.createElement("tr");
    tr.onclick = () => openDetail(g.id);
    for (const col of cols) {
      const td = document.createElement("td");
      if (col.key === "status") {
        if (g.status) td.appendChild(statusPill(g.status));
      } else if (col.key === "refs") {
        const first = refLines(getValue(g, col))[0];
        if (first) td.appendChild(makeRefLink(parseRef(first)));
      } else if (col.key === "updatedAt") {
        td.textContent = fmtDateTime(g.updatedAt);
        td.className = "muted";
      } else if (col.key === "title") {
        td.textContent = getValue(g, col);
        td.className = "title-cell";
      } else if (col.key === "nextTodo") {
        td.textContent = getValue(g, col);
        td.className = "wrap muted";
      } else {
        td.textContent = getValue(g, col);
      }
      tr.appendChild(td);
    }
    const tdAct = document.createElement("td");
    tdAct.className = "actions-cell";
    const mind = document.createElement("button");
    mind.className = "btn-ghost";
    mind.textContent = (g.mindmap && g.mindmap.nodes && g.mindmap.nodes.length) ? "🧠 マインドマップ" : "マインドマップ";
    mind.title = "このゲームのマインドマップを開く";
    mind.onclick = (e) => { e.stopPropagation(); openMindmap(g.id); };
    const del = document.createElement("button");
    del.className = "btn-danger";
    del.textContent = "削除";
    del.onclick = (e) => { e.stopPropagation(); removeGame(g.id); };
    tdAct.append(mind, del);
    tr.appendChild(tdAct);
    body.appendChild(tr);
  }
}

function statusPill(status) {
  const pill = document.createElement("span");
  pill.className = "pill";
  pill.textContent = status;
  pill.style.background = STATUS_COLORS[status] || "#3a4055";
  pill.style.color = "#fff";
  return pill;
}

function refreshStatusFilter() {
  const sel = document.getElementById("filterStatus");
  const cur = sel.value;
  sel.innerHTML = '<option value="">全ステータス</option>';
  for (const s of STATUS_OPTIONS) {
    const o = document.createElement("option");
    o.value = s; o.textContent = s;
    sel.appendChild(o);
  }
  sel.value = cur;
}

// 入力候補（既存値から収集）
function suggestionsFor(key) {
  const set = new Set();
  for (const g of data.games) { if (g[key]) set.add(g[key]); }
  return [...set].sort();
}

// ---- 詳細表示モーダル ----
let detailId = null;

function openDetail(id) {
  const g = data.games.find(x => x.id === id);
  if (!g) return;
  detailId = id;
  document.getElementById("detailTitle").textContent = g.title || "（無題）";

  const body = document.getElementById("detailBody");
  body.innerHTML = "";
  for (const col of allColumns()) {
    if (col.key === "title") continue; // タイトルは見出しに表示済み
    const row = document.createElement("div");
    row.className = "detail-row";
    const lab = document.createElement("div");
    lab.className = "detail-label";
    lab.textContent = col.label;
    const val = document.createElement("div");
    val.className = "detail-value";
    fillDetailValue(val, g, col);
    row.append(lab, val);
    body.appendChild(row);
  }
  document.getElementById("detailOverlay").classList.add("open");
}

function fillDetailValue(el, g, col) {
  if (col.key === "status") {
    if (g.status) el.appendChild(statusPill(g.status));
    else { el.classList.add("empty"); el.textContent = "—"; }
    return;
  }
  if (col.key === "updatedAt") {
    el.textContent = fmtDateTime(g.updatedAt) || "—";
    return;
  }
  if (col.key === "refs") {
    const lines = refLines(getValue(g, col));
    if (!lines.length) { el.classList.add("empty"); el.textContent = "—"; return; }
    const box = document.createElement("div");
    box.className = "ref-list";
    for (const line of lines) {
      const item = document.createElement("div");
      item.className = "ref-item";
      item.appendChild(makeRefLink(parseRef(line)));
      box.appendChild(item);
    }
    el.appendChild(box);
    return;
  }
  const v = getValue(g, col);
  if (v === "" || v == null) { el.classList.add("empty"); el.textContent = "—"; }
  else el.textContent = v;
}

function closeDetail() {
  document.getElementById("detailOverlay").classList.remove("open");
  detailId = null;
}

// ---- 追加・編集モーダル ----
let editingId = null;

function openEdit(id) {
  editingId = id;
  const game = id ? data.games.find(g => g.id === id) : null;
  document.getElementById("editTitle").textContent = game ? "ゲームを編集" : "ゲームを追加";
  document.getElementById("deleteBtn").style.display = game ? "" : "none";

  const wrap = document.getElementById("editFields");
  wrap.innerHTML = "";

  // 編集フォームは「タイトル + 表示順どおりの列」で構成（更新日時は自動なので除外）
  const fields = allColumns().filter(c => c.type !== "auto");

  for (const f of fields) {
    const div = document.createElement("div");
    div.className = "field";
    const lab = document.createElement("label");
    lab.textContent = f.label + (f.key === "title" ? " *" : "");
    div.appendChild(lab);

    const val = game ? (f.custom ? (game.extra?.[f.label] || "") : (game[f.key] || "")) : "";
    let input;
    if (f.type === "status") {
      input = document.createElement("select");
      const blank = document.createElement("option");
      blank.value = ""; blank.textContent = "（未設定）";
      input.appendChild(blank);
      for (const s of STATUS_OPTIONS) {
        const o = document.createElement("option");
        o.value = s; o.textContent = s;
        input.appendChild(o);
      }
      input.value = val;
    } else if (f.type === "textarea") {
      input = document.createElement("textarea");
      input.value = val;
    } else if (f.type === "refs") {
      input = document.createElement("textarea");
      input.value = val;
      input.placeholder = "1行に1サイト：URL の後ろに半角スペースを空けてページ名（ページ名は省略可）\n例: https://www.4gamer.net/games/123/ 攻略チャート1";
      input.rows = 4;
    } else if (f.type === "date") {
      input = document.createElement("input");
      input.type = "date";
      input.value = val;
    } else if (f.type === "datalist") {
      input = document.createElement("input");
      input.type = "text";
      input.value = val;
      const listId = "dl_" + f.key;
      const dl = document.createElement("datalist");
      dl.id = listId;
      // 設定された選択肢を優先表示し、過去に入力した値も候補に加える
      const opts = OPTION_FIELDS[f.key] ? getOptions(f.key) : suggestionsFor(f.key);
      const seen = new Set(opts);
      for (const s of suggestionsFor(f.key)) { if (!seen.has(s)) { opts.push(s); seen.add(s); } }
      for (const s of opts) {
        const o = document.createElement("option"); o.value = s; dl.appendChild(o);
      }
      input.setAttribute("list", listId);
      input.placeholder = "選択または入力";
      div.appendChild(dl);
    } else if (f.type === "number") {
      input = document.createElement("input");
      input.type = "number";
      input.step = "any"; input.min = "0";
      input.value = val;
      input.placeholder = f.key === "playtime" ? "時間（例：35）" : "";
    } else {
      input = document.createElement("input");
      input.type = "text";
      input.value = val;
    }
    input.dataset.fkey = f.key;
    input.dataset.custom = f.custom ? "1" : "";
    input.dataset.label = f.label;
    div.appendChild(input);
    wrap.appendChild(div);
  }

  document.getElementById("editOverlay").classList.add("open");
  const first = wrap.querySelector("input,select,textarea");
  if (first) first.focus();
}

function closeEdit() {
  document.getElementById("editOverlay").classList.remove("open");
  editingId = null;
}

function saveEdit() {
  const inputs = document.querySelectorAll("#editFields [data-fkey]");
  const obj = { extra: {} };
  let title = "";
  for (const inp of inputs) {
    const v = inp.value.trim();
    if (inp.dataset.custom === "1") {
      obj.extra[inp.dataset.label] = v;
    } else {
      obj[inp.dataset.fkey] = v;
      if (inp.dataset.fkey === "title") title = v;
    }
  }
  if (!title) { showToast("タイトルを入力してください"); return; }

  const now = new Date().toISOString();
  if (editingId) {
    const g = data.games.find(g => g.id === editingId);
    Object.assign(g, obj);
    g.extra = obj.extra;
    g.updatedAt = now;
  } else {
    obj.id = "g" + now + Math.floor(Math.random() * 1e6);
    obj.updatedAt = now;
    data.games.push(obj);
  }
  save();
  closeEdit();
  render();
  showToast("保存しました");
}

function removeGame(id) {
  const g = data.games.find(g => g.id === id);
  if (!g) return;
  if (!confirm(`「${g.title}」を削除しますか？`)) return;
  data.games = data.games.filter(x => x.id !== id);
  save();
  if (editingId === id) closeEdit();
  render();
  showToast("削除しました");
}

// ---- 列管理 ----
function openCols() {
  renderColsList();
  document.getElementById("colsOverlay").classList.add("open");
}
const TYPE_LABEL = { text: "文字", number: "数値", date: "日付", datalist: "選択", status: "選択", auto: "自動" };

function renderColsList() {
  const list = document.getElementById("colsList");
  list.innerHTML = "";

  // タイトル（常に先頭・固定。表示名のみ変更可能）
  const titleFc = FIXED_COLUMNS.find(c => c.key === "title");
  const titleRow = document.createElement("div");
  titleRow.className = "col-row fixed";
  const titleName = document.createElement("span");
  titleName.className = "name";
  titleName.textContent = colLabel("title", titleFc.label);
  const titleTag = document.createElement("span");
  titleTag.className = "muted"; titleTag.style.fontSize = "12px";
  titleTag.textContent = "先頭固定";
  const titleRen = document.createElement("button");
  titleRen.className = "btn-ghost"; titleRen.textContent = "名前変更";
  titleRen.onclick = () => renameFixed("title", colLabel("title", titleFc.label));
  titleRow.append(titleName, titleTag, titleRen);
  list.appendChild(titleRow);

  // タイトル以降（並び替え可能）
  data.order.forEach((key, i) => {
    const isCustom = key.startsWith("x:");
    const cc = isCustom ? data.customColumns.find(c => c.name === key.slice(2)) : null;
    const fc = !isCustom ? FIXED_COLUMNS.find(c => c.key === key) : null;
    const label = isCustom ? cc.name : colLabel(fc.key, fc.label);
    const type = isCustom ? (cc.type || "text") : fc.type;

    const row = document.createElement("div");
    row.className = "col-row" + (isHidden(key) ? " hidden" : "");

    const vis = document.createElement("input");
    vis.type = "checkbox";
    vis.checked = !isHidden(key);
    vis.title = "一覧に表示する";
    vis.onchange = () => {
      if (vis.checked) data.hiddenColumns = data.hiddenColumns.filter(k => k !== key);
      else if (!data.hiddenColumns.includes(key)) data.hiddenColumns.push(key);
      save(); renderColsList(); render();
    };

    const span = document.createElement("span");
    span.className = "name";
    span.textContent = label;
    const tag = document.createElement("span");
    tag.className = "muted"; tag.style.fontSize = "12px";
    tag.textContent = (isCustom ? "任意・" : "標準・") + (TYPE_LABEL[type] || "文字");

    const up = document.createElement("button");
    up.className = "ord"; up.textContent = "▲"; up.title = "上へ";
    up.disabled = i === 0;
    up.onclick = () => { [data.order[i-1], data.order[i]] = [data.order[i], data.order[i-1]]; save(); renderColsList(); render(); };

    const down = document.createElement("button");
    down.className = "ord"; down.textContent = "▼"; down.title = "下へ";
    down.disabled = i === data.order.length - 1;
    down.onclick = () => { [data.order[i+1], data.order[i]] = [data.order[i], data.order[i+1]]; save(); renderColsList(); render(); };

    row.append(vis, span, tag, up, down);
    if (isCustom) {
      const ren = document.createElement("button");
      ren.className = "btn-ghost"; ren.textContent = "名前変更";
      ren.onclick = () => renameCol(key.slice(2));
      const del = document.createElement("button");
      del.className = "btn-danger"; del.textContent = "削除";
      del.onclick = () => deleteCol(key.slice(2));
      row.append(ren, del);
    } else {
      // 標準項目：表示名のみ変更可能（削除は不可）
      const ren = document.createElement("button");
      ren.className = "btn-ghost"; ren.textContent = "名前変更";
      ren.onclick = () => renameFixed(key, label);
      row.append(ren);
    }
    list.appendChild(row);
  });
}
function addCol() {
  const inp = document.getElementById("newColName");
  const typeSel = document.getElementById("newColType");
  const name = inp.value.trim();
  if (!name) return;
  if (allColumns().some(c => c.label === name) || data.customColumns.some(c => c.name === name)) {
    showToast("同じ名前の項目があります"); return;
  }
  data.customColumns.push({ name, type: typeSel.value || "text" });
  normalizeOrder();
  inp.value = "";
  save(); renderColsList(); render();
}
// 標準項目の表示名を変更（内部キーは変えず、data.labels に上書きを保存）
function renameFixed(key, current) {
  const name = prompt("新しい表示名", current);
  if (name == null) return;
  const t = name.trim();
  if (!t || t === current) return;
  const used = allColumns().filter(c => c.key !== key).map(c => c.label);
  if (used.includes(t) || data.customColumns.some(c => c.name === t)) {
    showToast("同じ名前の項目があります"); return;
  }
  data.labels = data.labels || {};
  data.labels[key] = t;
  save(); renderColsList(); render();
}
function renameCol(old) {
  const cc = data.customColumns.find(c => c.name === old);
  if (!cc) return;
  const name = prompt("新しい項目名", old);
  if (!name) return;
  const t = name.trim();
  if (!t || t === old) return;
  if (allColumns().some(c => c.label === t) || data.customColumns.some(c => c.name === t)) {
    showToast("同じ名前の項目があります"); return;
  }
  cc.name = t;
  // 並び順キーも置き換えて位置を維持
  const oi = data.order.indexOf("x:" + old);
  if (oi >= 0) data.order[oi] = "x:" + t;
  for (const g of data.games) {
    if (g.extra && old in g.extra) { g.extra[t] = g.extra[old]; delete g.extra[old]; }
  }
  save(); renderColsList(); render();
}
function deleteCol(name) {
  if (!confirm(`項目「${name}」を削除しますか？\n各ゲームのこの項目の内容も消えます。`)) return;
  data.customColumns = data.customColumns.filter(c => c.name !== name);
  normalizeOrder();
  for (const g of data.games) { if (g.extra) delete g.extra[name]; }
  save(); renderColsList(); render();
}

// ---- 選択肢の設定（プラットフォーム / ジャンル）----
let optTarget = "platform";

function openOpts() {
  const sel = document.getElementById("optTarget");
  sel.innerHTML = "";
  for (const [key, def] of Object.entries(OPTION_FIELDS)) {
    const o = document.createElement("option");
    o.value = key; o.textContent = def.label;
    sel.appendChild(o);
  }
  sel.value = optTarget;
  renderOptsList();
  document.getElementById("optsOverlay").classList.add("open");
}

function renderOptsList() {
  const list = document.getElementById("optsList");
  list.innerHTML = "";
  const arr = data.options[optTarget];
  arr.forEach((opt, i) => {
    const row = document.createElement("div");
    row.className = "opt-row" + (opt.show === false ? " hidden" : "");

    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = opt.show !== false;
    cb.title = "表示する";
    cb.onchange = () => { opt.show = cb.checked; save(); renderOptsList(); render(); };

    const name = document.createElement("span");
    name.className = "name";
    name.textContent = (OPT_DISPLAY_LABELS[optTarget] && OPT_DISPLAY_LABELS[optTarget][opt.v]) || opt.v;

    const up = document.createElement("button");
    up.className = "ord"; up.textContent = "▲"; up.title = "上へ";
    up.disabled = i === 0;
    up.onclick = () => { [arr[i-1], arr[i]] = [arr[i], arr[i-1]]; save(); renderOptsList(); render(); };

    const down = document.createElement("button");
    down.className = "ord"; down.textContent = "▼"; down.title = "下へ";
    down.disabled = i === arr.length - 1;
    down.onclick = () => { [arr[i+1], arr[i]] = [arr[i], arr[i+1]]; save(); renderOptsList(); render(); };

    const del = document.createElement("button");
    del.className = "del"; del.textContent = "削除";
    del.onclick = () => {
      if (!confirm(`選択肢「${opt.v}」を削除しますか？\n（登録済みゲームの入力内容は変わりません）`)) return;
      arr.splice(i, 1); save(); renderOptsList(); render();
    };

    row.append(cb, name, up, down, del);
    list.appendChild(row);
  });
}

function addOpt() {
  const inp = document.getElementById("newOptName");
  const v = inp.value.trim();
  if (!v) return;
  const arr = data.options[optTarget];
  if (arr.some(o => o.v === v)) { showToast("同じ選択肢があります"); return; }
  arr.push({ v, show: true });
  inp.value = "";
  save(); renderOptsList(); render();
}

function resetOpts() {
  const def = OPTION_FIELDS[optTarget];
  if (!confirm(`「${def.label}」の選択肢を初期値に戻しますか？\n追加・並び替え・表示設定はすべてリセットされます。`)) return;
  data.options[optTarget] = def.defaults.map(v => ({ v, show: true }));
  save(); renderOptsList(); render();
}

// ---- エクスポート / インポート ----
function exportData() {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  a.href = url;
  a.download = `game-progress_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast("エクスポートしました");
}
function importData(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const obj = JSON.parse(reader.result);
      if (!Array.isArray(obj.games)) throw new Error("形式が不正です");
      if (!confirm(`現在のデータを置き換えて読み込みますか？（${obj.games.length} 本）\n念のため事前のエクスポートを推奨します。`)) return;
      // 旧形式の取り込みにも対応（loadData と同じ正規化）
      data = migrate(obj);
      normalizeOrder();
      save(); render();
      showToast("インポートしました");
    } catch (e) {
      alert("読み込みに失敗しました: " + e.message);
    }
  };
  reader.readAsText(file);
}

// ==== マインドマップ ====
// データは各ゲームの g.mindmap に保存（nodes / edges / fontSize / scale / panX / panY）。
// 図形は四角のみ。四角には単語・URL（自動リンク化）・貼り付け画像を入れられ、
// 個別にサイズ変更・見出し指定ができる。ノード: { id, x, y, w?, h?, text, img, heading? }
const MM_NS = "http://www.w3.org/2000/svg";
const MM_URL_RE = /(https?:\/\/[^\s]+)/g;
const MM_UNDO_MAX = 3; // 元に戻せる手数

let mmGame = null;          // 表示中のゲーム
let mmSel = new Set();      // 選択中ノードIDの集合
let mmEditing = null;       // 編集中ノード（オブジェクト）
let mmConnectMode = false;  // 接続モード中か
let mmConnectFrom = null;   // 接続の始点ノードID
let mmDrag = null;          // ノードドラッグ状態（複数移動対応）
let mmResize = null;        // サイズ変更状態
let mmPan = null;           // キャンバスパン状態（Ctrl+ドラッグ）
let mmSelecting = null;     // 範囲選択状態
let mmUndoStack = [];       // 元に戻す用スナップショット（最大 MM_UNDO_MAX 件）
const mmNodeEls = new Map();// nodeId -> DOM要素

function mmNewId() {
  return "n" + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36);
}

function ensureMindmap(g) {
  if (!g.mindmap || typeof g.mindmap !== "object") g.mindmap = {};
  const m = g.mindmap;
  if (!Array.isArray(m.nodes)) m.nodes = [];
  if (!Array.isArray(m.edges)) m.edges = [];
  if (typeof m.fontSize !== "number") m.fontSize = 14;
  if (typeof m.scale !== "number") m.scale = 1;
  if (typeof m.panX !== "number") m.panX = 0;
  if (typeof m.panY !== "number") m.panY = 0;
  return m;
}

// ---- 元に戻す（Undo）----
// nodes / edges のスナップショット（変更前の状態）を積む。表示状態（拡大・位置）は対象外。
function mmSnapshot() {
  return JSON.stringify({ nodes: mmGame.mindmap.nodes, edges: mmGame.mindmap.edges });
}
function mmPushUndo(snap) {
  mmUndoStack.push(snap != null ? snap : mmSnapshot());
  while (mmUndoStack.length > MM_UNDO_MAX) mmUndoStack.shift();
}
function mmUndo() {
  if (!mmUndoStack.length) { showToast("これ以上戻せません"); return; }
  const st = JSON.parse(mmUndoStack.pop());
  mmGame.mindmap.nodes = st.nodes;
  mmGame.mindmap.edges = st.edges;
  mmSel = new Set();
  mmConnectFrom = null;
  mmEditing = null;
  save();
  renderMindmap();
}

function openMindmap(id) {
  const g = data.games.find(x => x.id === id);
  if (!g) return;
  mmGame = g;
  ensureMindmap(g);
  mmSel = new Set(); mmEditing = null; mmConnectMode = false; mmConnectFrom = null;
  mmDrag = null; mmResize = null; mmPan = null; mmSelecting = null; mmUndoStack = [];
  document.getElementById("mmTitle").textContent = "🧠 " + (g.title || "（無題）");
  // 見出しパネルは開くたびに展開状態から
  const hp = document.getElementById("mmHeadings");
  hp.classList.remove("collapsed");
  document.getElementById("mmHeadToggle").textContent = "◀";
  document.getElementById("mindmapScreen").classList.add("open");
  // 画面表示後にキャンバスサイズが確定するので描画・初期配置を次フレームで行う
  requestAnimationFrame(() => {
    const m = mmGame.mindmap;
    if (m.nodes.length === 0) {
      // 初回：タイトルの中心ノードを1つ作り、画面中央に来るようパンを設定
      m.nodes.push({ id: mmNewId(), x: 0, y: 0, text: g.title || "", img: "" });
      const cv = document.getElementById("mmCanvas");
      m.panX = Math.round(cv.clientWidth / 2 - 60);
      m.panY = Math.round(cv.clientHeight / 2 - 20);
      save();
    }
    renderMindmap();
  });
}

function closeMindmap() {
  document.getElementById("mindmapScreen").classList.remove("open");
  mmGame = null; mmSel = new Set(); mmEditing = null;
  mmConnectMode = false; mmConnectFrom = null;
  mmDrag = null; mmResize = null; mmPan = null; mmSelecting = null; mmUndoStack = [];
  render(); // 一覧の「🧠」表示を更新
}

function mmApplyTransform() {
  const m = mmGame.mindmap;
  document.getElementById("mmWorld").style.transform =
    `translate(${m.panX}px, ${m.panY}px) scale(${m.scale})`;
}

function renderMindmap() {
  if (!mmGame) return;
  const m = mmGame.mindmap;
  mmApplyTransform();
  document.getElementById("mmWorld").style.fontSize = m.fontSize + "px";
  document.getElementById("mmFontVal").textContent = m.fontSize + "px";
  document.getElementById("mmZoomVal").textContent = Math.round(m.scale * 100) + "%";
  document.getElementById("mmConnect").classList.toggle("btn-primary", mmConnectMode);
  document.getElementById("mmUndo").disabled = mmUndoStack.length === 0;
  document.getElementById("mmHint").textContent = mmConnectMode
    ? "接続モード：つなぐ2つの四角を順にクリック（同じ組を再クリックで接続解除／「接続」でモード終了）"
    : "ドラッグ＝範囲選択（複数まとめて移動）／Ctrl+ドラッグ＝画面移動／何もない所をダブルクリックで四角を追加／四角の右下でサイズ変更／画像は Ctrl+V／Ctrl+Z で元に戻す";
  renderNodes();
  renderEdges();
  renderHeadings();
}

function renderNodes() {
  const box = document.getElementById("mmNodes");
  box.innerHTML = "";
  mmNodeEls.clear();
  for (const n of mmGame.mindmap.nodes) {
    const el = document.createElement("div");
    el.className = "mm-node"
      + (mmSel.has(n.id) ? " selected" : "")
      + (n.id === mmConnectFrom ? " connect-src" : "")
      + (n.heading ? " heading" : "");
    el.style.left = n.x + "px";
    el.style.top = n.y + "px";
    if (n.w) { el.style.width = n.w + "px"; el.style.maxWidth = "none"; }
    if (n.h) el.style.height = n.h + "px";

    if (n.heading) {
      const badge = document.createElement("span");
      badge.className = "mm-node-badge";
      badge.textContent = "見出し";
      el.appendChild(badge);
    }

    const del = document.createElement("button");
    del.className = "mm-node-del";
    del.textContent = "✕";
    del.title = "この四角を削除";
    del.onclick = (e) => { e.stopPropagation(); deleteNode(n.id); };

    const content = document.createElement("div");
    content.className = "mm-node-content";
    fillNodeContent(content, n);

    const rz = document.createElement("div");
    rz.className = "mm-node-resize";
    rz.title = "サイズ変更";
    rz.addEventListener("mousedown", (e) => onResizeStart(e, n, el));

    el.append(del, content, rz);
    el.addEventListener("mousedown", (e) => onNodeMouseDown(e, n));
    content.addEventListener("dblclick", (e) => { e.stopPropagation(); startEditNode(n, content); });

    box.appendChild(el);
    mmNodeEls.set(n.id, el);
  }
}

// 四角の中身：画像（あれば）＋ URL 自動リンク化したテキスト。空ならプレースホルダ。
function fillNodeContent(el, n) {
  el.innerHTML = "";
  if (n.img) {
    const img = document.createElement("img");
    img.src = n.img;
    el.appendChild(img);
  }
  if (n.text) {
    appendLinkified(el, n.text);
  } else if (!n.img) {
    const ph = document.createElement("span");
    ph.className = "placeholder";
    ph.textContent = "（ダブルクリックで入力）";
    el.appendChild(ph);
  }
}

function appendLinkified(parent, text) {
  const parts = String(text).split(MM_URL_RE);
  for (const part of parts) {
    if (!part) continue;
    if (/^https?:\/\//.test(part)) {
      const a = document.createElement("a");
      a.href = part; a.target = "_blank"; a.rel = "noopener";
      a.textContent = part;
      a.addEventListener("mousedown", e => e.stopPropagation()); // リンククリックでドラッグさせない
      a.addEventListener("click", e => e.stopPropagation());
      parent.appendChild(a);
    } else {
      parent.appendChild(document.createTextNode(part));
    }
  }
}

// エッジ（四角どうしをつなぐ線）。ノードの中心どうしを結ぶ。座標はワールド（未拡大）px。
function renderEdges() {
  const svg = document.getElementById("mmEdges");
  svg.innerHTML = "";
  const m = mmGame.mindmap;
  for (const ed of m.edges) {
    const na = m.nodes.find(n => n.id === ed.from);
    const nb = m.nodes.find(n => n.id === ed.to);
    const ea = mmNodeEls.get(ed.from);
    const eb = mmNodeEls.get(ed.to);
    if (!na || !nb || !ea || !eb) continue;
    const ax = na.x + ea.offsetWidth / 2, ay = na.y + ea.offsetHeight / 2;
    const bx = nb.x + eb.offsetWidth / 2, by = nb.y + eb.offsetHeight / 2;
    const line = document.createElementNS(MM_NS, "line");
    line.setAttribute("x1", ax); line.setAttribute("y1", ay);
    line.setAttribute("x2", bx); line.setAttribute("y2", by);
    line.setAttribute("stroke", "#5b8cff");
    line.setAttribute("stroke-width", "2");
    svg.appendChild(line);
  }
}

// ---- 見出し一覧（右パネル）----
function renderHeadings() {
  const list = document.getElementById("mmHeadingsList");
  list.innerHTML = "";
  const heads = mmGame.mindmap.nodes.filter(n => n.heading);
  if (!heads.length) {
    const e = document.createElement("div");
    e.className = "mm-headings-empty";
    e.textContent = "見出しはありません";
    list.appendChild(e);
    return;
  }
  for (const n of heads) {
    const item = document.createElement("div");
    item.className = "mm-heading-item";
    const label = (n.text || "").split("\n")[0].trim() || "（無題）";
    item.textContent = label;
    item.title = label;
    item.onclick = () => focusNode(n);
    list.appendChild(item);
  }
}

// 指定ノードを画面中央へ（拡大率は維持）
function focusNode(n) {
  const cv = document.getElementById("mmCanvas");
  const m = mmGame.mindmap;
  const el = mmNodeEls.get(n.id);
  const w = el ? el.offsetWidth : (n.w || 120);
  const h = el ? el.offsetHeight : (n.h || 40);
  m.panX = cv.clientWidth / 2 - (n.x + w / 2) * m.scale;
  m.panY = cv.clientHeight / 2 - (n.y + h / 2) * m.scale;
  save();
  mmApplyTransform();
}

// ---- 選択管理（複数選択）----
function mmUpdateSelClasses() {
  for (const [nid, el] of mmNodeEls) el.classList.toggle("selected", mmSel.has(nid));
}
function mmSelectOnly(id) { mmSel = new Set([id]); mmUpdateSelClasses(); }
function mmSelectClear() { mmSel = new Set(); mmUpdateSelClasses(); }
function mmSetConnectFrom(id) {
  mmConnectFrom = id;
  for (const [nid, el] of mmNodeEls) el.classList.toggle("connect-src", nid === id);
}

function onNodeMouseDown(e, n) {
  if (e.target.closest("a") || e.target.closest("textarea")
    || e.target.closest(".mm-node-del") || e.target.closest(".mm-node-resize")) return;
  e.stopPropagation(); // 背景の範囲選択・パンと分離
  if (mmConnectMode) { handleConnectClick(n); return; }
  // 未選択の四角を掴んだら単独選択に切り替え。選択済みなら選択全体を維持したまま移動。
  if (!mmSel.has(n.id)) mmSelectOnly(n.id);
  const moving = mmGame.mindmap.nodes.filter(x => mmSel.has(x.id)).map(x => ({ n: x, ox: x.x, oy: x.y }));
  mmDrag = { snap: mmSnapshot(), moving, startX: e.clientX, startY: e.clientY, moved: false };
}

function onResizeStart(e, n, el) {
  e.stopPropagation();
  e.preventDefault();
  mmResize = { n, el, snap: mmSnapshot(), startX: e.clientX, startY: e.clientY,
    ow: el.offsetWidth, oh: el.offsetHeight, changed: false };
}

function onMmMouseMove(e) {
  if (!mmGame) return;
  const m = mmGame.mindmap;
  if (mmResize) {
    const s = m.scale;
    const nw = Math.max(48, Math.round(mmResize.ow + (e.clientX - mmResize.startX) / s));
    const nh = Math.max(28, Math.round(mmResize.oh + (e.clientY - mmResize.startY) / s));
    mmResize.n.w = nw; mmResize.n.h = nh; mmResize.changed = true;
    mmResize.el.style.width = nw + "px";
    mmResize.el.style.maxWidth = "none";
    mmResize.el.style.height = nh + "px";
    renderEdges();
  } else if (mmDrag) {
    const s = m.scale;
    const dx = (e.clientX - mmDrag.startX) / s;
    const dy = (e.clientY - mmDrag.startY) / s;
    if (Math.abs(dx) > 1 || Math.abs(dy) > 1) mmDrag.moved = true;
    for (const it of mmDrag.moving) {
      it.n.x = Math.round(it.ox + dx);
      it.n.y = Math.round(it.oy + dy);
      const el = mmNodeEls.get(it.n.id);
      if (el) { el.style.left = it.n.x + "px"; el.style.top = it.n.y + "px"; }
    }
    renderEdges();
  } else if (mmPan) {
    m.panX = mmPan.opx + (e.clientX - mmPan.startX);
    m.panY = mmPan.opy + (e.clientY - mmPan.startY);
    mmApplyTransform();
  } else if (mmSelecting) {
    const x = e.clientX - mmSelecting.rect.left;
    const y = e.clientY - mmSelecting.rect.top;
    const left = Math.min(x, mmSelecting.x0), top = Math.min(y, mmSelecting.y0);
    const w = Math.abs(x - mmSelecting.x0), h = Math.abs(y - mmSelecting.y0);
    mmSelecting.curr = { left, top, w, h };
    const box = document.getElementById("mmSelectBox");
    box.style.left = left + "px"; box.style.top = top + "px";
    box.style.width = w + "px"; box.style.height = h + "px";
  }
}

function onMmMouseUp() {
  if (mmResize) {
    if (mmResize.changed) { mmPushUndo(mmResize.snap); save(); }
    mmResize = null;
  }
  if (mmDrag) {
    if (mmDrag.moved) { mmPushUndo(mmDrag.snap); save(); renderMindmap(); }
    mmDrag = null;
  }
  if (mmPan) {
    document.getElementById("mmCanvas").classList.remove("panning");
    mmPan = null; save();
  }
  if (mmSelecting) {
    const box = document.getElementById("mmSelectBox");
    box.style.display = "none";
    const sel = mmSelecting.curr;
    if (sel && (sel.w > 3 || sel.h > 3)) {
      const m = mmGame.mindmap;
      const picked = new Set();
      for (const nd of m.nodes) {
        const el = mmNodeEls.get(nd.id);
        if (!el) continue;
        const nx = m.panX + nd.x * m.scale, ny = m.panY + nd.y * m.scale;
        const nw = el.offsetWidth * m.scale, nh = el.offsetHeight * m.scale;
        // 選択矩形（キャンバス座標）とノードの表示矩形が交差していれば選択
        if (nx < sel.left + sel.w && nx + nw > sel.left && ny < sel.top + sel.h && ny + nh > sel.top) {
          picked.add(nd.id);
        }
      }
      mmSel = picked;
      mmUpdateSelClasses();
    }
    mmSelecting = null;
  }
}

// 背景での mousedown：Ctrl+ドラッグで画面移動、素のドラッグで範囲選択。
function onCanvasMouseDown(e) {
  if (!mmGame) return;
  if (e.target.closest(".mm-node") || e.target.closest(".mm-headings")) return;
  const m = mmGame.mindmap;
  if (e.ctrlKey || e.metaKey) {
    mmPan = { startX: e.clientX, startY: e.clientY, opx: m.panX, opy: m.panY };
    document.getElementById("mmCanvas").classList.add("panning");
    return;
  }
  // 範囲選択の開始
  mmSelectClear();
  const rect = document.getElementById("mmCanvas").getBoundingClientRect();
  mmSelecting = { rect, x0: e.clientX - rect.left, y0: e.clientY - rect.top, curr: null };
  const box = document.getElementById("mmSelectBox");
  box.style.display = "block";
  box.style.left = mmSelecting.x0 + "px"; box.style.top = mmSelecting.y0 + "px";
  box.style.width = "0"; box.style.height = "0";
}

// 何もない所をダブルクリック → その位置に四角を追加
function onCanvasDblClick(e) {
  if (!mmGame || mmConnectMode) return;
  if (e.target.closest(".mm-node") || e.target.closest(".mm-headings")) return;
  const cv = document.getElementById("mmCanvas");
  const rect = cv.getBoundingClientRect();
  const m = mmGame.mindmap;
  const wx = (e.clientX - rect.left - m.panX) / m.scale;
  const wy = (e.clientY - rect.top - m.panY) / m.scale;
  mmPushUndo();
  const n = { id: mmNewId(), x: Math.round(wx - 60), y: Math.round(wy - 20), text: "", img: "" };
  m.nodes.push(n);
  mmSelectOnly(n.id);
  save();
  renderMindmap();
  const content = mmNodeEls.get(n.id)?.querySelector(".mm-node-content");
  if (content) startEditNode(n, content);
}

// 画面中央のワールド座標を返す
function mmViewCenterWorld() {
  const cv = document.getElementById("mmCanvas");
  const m = mmGame.mindmap;
  return {
    x: (cv.clientWidth / 2 - m.panX) / m.scale,
    y: (cv.clientHeight / 2 - m.panY) / m.scale,
  };
}

function addMindmapNode() {
  const m = mmGame.mindmap;
  const c = mmViewCenterWorld();
  mmPushUndo();
  const n = { id: mmNewId(), x: Math.round(c.x - 60), y: Math.round(c.y - 20), text: "", img: "" };
  m.nodes.push(n);
  mmSelectOnly(n.id);
  save();
  renderMindmap();
  const content = mmNodeEls.get(n.id)?.querySelector(".mm-node-content");
  if (content) startEditNode(n, content);
}

// ✕ ボタン：単独削除
function deleteNode(id) {
  mmPushUndo();
  const m = mmGame.mindmap;
  m.nodes = m.nodes.filter(n => n.id !== id);
  m.edges = m.edges.filter(e => e.from !== id && e.to !== id);
  mmSel.delete(id);
  if (mmConnectFrom === id) mmConnectFrom = null;
  if (mmEditing && mmEditing.id === id) mmEditing = null;
  save();
  renderMindmap();
}

// Delete キー：選択中の四角をまとめて削除
function deleteSelected() {
  if (!mmSel.size) return;
  mmPushUndo();
  const m = mmGame.mindmap;
  const ids = mmSel;
  m.nodes = m.nodes.filter(n => !ids.has(n.id));
  m.edges = m.edges.filter(e => !ids.has(e.from) && !ids.has(e.to));
  mmSel = new Set();
  save();
  renderMindmap();
}

function startEditNode(n, content) {
  if (mmConnectMode) return;
  mmEditing = n;
  // 編集中も四角のサイズを保つため、現在の中身のサイズで textarea を固定する
  const w = content.offsetWidth, h = content.offsetHeight;
  content.innerHTML = "";
  const ta = document.createElement("textarea");
  ta.className = "mm-node-edit";
  ta.value = n.text || "";
  ta.style.width = w + "px";
  ta.style.height = h + "px";
  ta.addEventListener("mousedown", e => e.stopPropagation()); // 編集中はドラッグさせない
  content.appendChild(ta);
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);

  const before = n.text || "";
  const finish = () => {
    if (mmEditing !== n) return;
    mmEditing = null;
    if (ta.value !== before) {
      mmPushUndo();      // 変更前の状態を記録（この時点で n.text はまだ変更前）
      n.text = ta.value;
      save();
    }
    fillNodeContent(content, n);
    renderEdges();
    renderHeadings();
  };
  ta.addEventListener("blur", finish);
  ta.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); ta.blur(); }
    else if (e.key === "Escape") { e.preventDefault(); ta.value = before; ta.blur(); }
  });
}

function toggleConnectMode() {
  mmConnectMode = !mmConnectMode;
  mmConnectFrom = null;
  renderMindmap();
}

function handleConnectClick(n) {
  if (!mmConnectFrom) { mmSetConnectFrom(n.id); return; }
  if (mmConnectFrom === n.id) { mmSetConnectFrom(null); return; }
  const m = mmGame.mindmap;
  const same = (e) => (e.from === mmConnectFrom && e.to === n.id) || (e.from === n.id && e.to === mmConnectFrom);
  mmPushUndo();
  if (m.edges.some(same)) m.edges = m.edges.filter(e => !same(e)); // 既にあれば解除
  else m.edges.push({ from: mmConnectFrom, to: n.id });
  mmConnectFrom = null;
  save();
  renderMindmap();
}

// 選択中の四角の見出し指定を切り替え（全て見出しなら解除、そうでなければ見出しに）
function toggleHeading() {
  if (!mmSel.size) { showToast("四角を選んでから押してください"); return; }
  const nodes = mmGame.mindmap.nodes.filter(n => mmSel.has(n.id));
  if (!nodes.length) return;
  mmPushUndo();
  const allHead = nodes.every(n => n.heading);
  for (const n of nodes) n.heading = !allHead;
  save();
  renderMindmap();
}

function mmChangeFont(delta) {
  const m = mmGame.mindmap;
  m.fontSize = Math.max(8, Math.min(48, m.fontSize + delta));
  save();
  renderMindmap();
}

function mmZoom(factor, cx, cy) {
  const m = mmGame.mindmap;
  const cv = document.getElementById("mmCanvas");
  const rect = cv.getBoundingClientRect();
  const px = cx != null ? cx - rect.left : cv.clientWidth / 2;
  const py = cy != null ? cy - rect.top : cv.clientHeight / 2;
  const old = m.scale;
  const ns = Math.max(0.2, Math.min(3, old * factor));
  // カーソル位置（なければ中央）を固定したまま拡大縮小
  const wx = (px - m.panX) / old, wy = (py - m.panY) / old;
  m.panX = px - wx * ns;
  m.panY = py - wy * ns;
  m.scale = ns;
  save();
  renderMindmap();
}

function mmZoomReset() {
  mmGame.mindmap.scale = 1;
  save();
  renderMindmap();
}

// クリップボードの画像を貼り付け：編集中の四角に付ける／なければ中央に画像の四角を新規作成
function onMmPaste(e) {
  if (!mmGame || !document.getElementById("mindmapScreen").classList.contains("open")) return;
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (const it of items) {
    if (it.type && it.type.startsWith("image/")) {
      e.preventDefault();
      const file = it.getAsFile();
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const dataUrl = reader.result;
        mmPushUndo();
        if (mmEditing) {
          const target = mmEditing;
          const ae = document.activeElement;
          if (ae && ae.blur) ae.blur(); // 入力中テキストを確定（mmEditing は null になる）
          target.img = dataUrl;
        } else {
          const c = mmViewCenterWorld();
          mmGame.mindmap.nodes.push({ id: mmNewId(), x: Math.round(c.x - 80), y: Math.round(c.y - 60), text: "", img: dataUrl });
        }
        save();
        renderMindmap();
      };
      reader.readAsDataURL(file);
      return;
    }
  }
}

// ---- トースト ----
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

// ---- イベント ----
document.getElementById("addBtn").onclick = () => openEdit(null);
document.getElementById("detailClose").onclick = closeDetail;
document.getElementById("detailEdit").onclick = () => { const id = detailId; closeDetail(); openEdit(id); };
document.getElementById("detailDelete").onclick = () => { const id = detailId; closeDetail(); removeGame(id); };
document.getElementById("saveEdit").onclick = saveEdit;
document.getElementById("cancelEdit").onclick = closeEdit;
document.getElementById("deleteBtn").onclick = () => removeGame(editingId);
document.getElementById("optsBtn").onclick = openOpts;
document.getElementById("optTarget").onchange = e => { optTarget = e.target.value; renderOptsList(); };
document.getElementById("addOptBtn").onclick = addOpt;
document.getElementById("newOptName").onkeydown = e => { if (e.key === "Enter") addOpt(); };
document.getElementById("resetOptBtn").onclick = resetOpts;
document.getElementById("closeOpts").onclick = () => document.getElementById("optsOverlay").classList.remove("open");
document.getElementById("colsBtn").onclick = openCols;
document.getElementById("closeCols").onclick = () => document.getElementById("colsOverlay").classList.remove("open");
document.getElementById("addColBtn").onclick = addCol;
document.getElementById("newColName").onkeydown = e => { if (e.key === "Enter") addCol(); };
document.getElementById("exportBtn").onclick = exportData;
document.getElementById("importBtn").onclick = () => document.getElementById("importFile").click();
document.getElementById("importFile").onchange = e => { if (e.target.files[0]) importData(e.target.files[0]); e.target.value = ""; };
document.getElementById("search").oninput = e => { searchText = e.target.value; render(); };
document.getElementById("filterStatus").onchange = e => { filterStatus = e.target.value; render(); };

// ---- マインドマップのイベント ----
document.getElementById("mmBack").onclick = closeMindmap;
document.getElementById("mmAddNode").onclick = addMindmapNode;
document.getElementById("mmConnect").onclick = toggleConnectMode;
document.getElementById("mmHeading").onclick = toggleHeading;
document.getElementById("mmUndo").onclick = mmUndo;
document.getElementById("mmFontDown").onclick = () => mmChangeFont(-1);
document.getElementById("mmFontUp").onclick = () => mmChangeFont(1);
document.getElementById("mmZoomOut").onclick = () => mmZoom(1 / 1.2);
document.getElementById("mmZoomIn").onclick = () => mmZoom(1.2);
document.getElementById("mmZoomReset").onclick = mmZoomReset;
document.getElementById("mmHeadToggle").onclick = () => {
  const p = document.getElementById("mmHeadings");
  p.classList.toggle("collapsed");
  document.getElementById("mmHeadToggle").textContent = p.classList.contains("collapsed") ? "▶" : "◀";
};
document.getElementById("mmCanvas").addEventListener("mousedown", onCanvasMouseDown);
document.getElementById("mmCanvas").addEventListener("dblclick", onCanvasDblClick);
document.getElementById("mmCanvas").addEventListener("wheel", (e) => {
  if (!mmGame) return;
  if (e.target.closest(".mm-headings")) return; // 見出し一覧はそのままスクロール
  e.preventDefault();
  mmZoom(e.deltaY < 0 ? 1.1 : 1 / 1.1, e.clientX, e.clientY);
}, { passive: false });
document.addEventListener("mousemove", onMmMouseMove);
document.addEventListener("mouseup", onMmMouseUp);
document.addEventListener("paste", onMmPaste);

// オーバーレイ外クリックで閉じる
for (const ov of document.querySelectorAll(".overlay")) {
  ov.addEventListener("click", e => { if (e.target === ov) ov.classList.remove("open"); });
}
document.addEventListener("keydown", e => {
  if (e.key === "Escape") document.querySelectorAll(".overlay.open").forEach(o => o.classList.remove("open"));
});

// マインドマップ画面のキー操作（Ctrl+Z で元に戻す、Esc で戻る、Delete で選択中の四角を削除）
document.addEventListener("keydown", e => {
  if (!mmGame || !document.getElementById("mindmapScreen").classList.contains("open")) return;
  if ((e.ctrlKey || e.metaKey) && (e.key === "z" || e.key === "Z")) {
    if (mmEditing) return; // 編集中は textarea 自身の取り消しを優先
    e.preventDefault(); mmUndo(); return;
  }
  if (mmEditing) return; // 編集中は textarea を優先
  if (e.key === "Escape") { e.preventDefault(); closeMindmap(); }
  else if ((e.key === "Delete" || e.key === "Backspace") && mmSel.size) { e.preventDefault(); deleteSelected(); }
});

render();
</script>
